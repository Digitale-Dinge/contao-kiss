tl_content:
    layout_legend:              Layout-Einstellungen
    grid_legend:                Grid-Einstellungen
    appearance_legend:          Darstellungs-Einstellungen

    grid:                       Spalten-Grid
    contentTeaser:              Teaser

    headline:
        unit:                   Einheit
        appearance:             Aussehen

    lightboxIframe:
        - Inhalt in iFrame öffnen
        - Öffnet den Link in einem iFrame und bettet so die externe Seite in die eigene Seite ein.

    topline:
        - Dachzeile
        - Stellt eine optionale Dachzeile über der Headline dar

    color:
        - Farbe
        - Bestimmen Sie die Farbe des Elements.

    callToAction:
        - Call-To-Action
        - Hier können Sie eine oder mehrere Call-To-Action angeben, welche auf der Website angezeigt werden sollen.

    ctaAsButton:
        - Als Button darstellen
        - Verändert die Darstellung von einem Textlink in einen Button

    ctaText:
        - Text
        - Hier können Sie einen Text eingeben.

    ctaType:
        - Typ
        - Bestimmen Sie die den Typ der Aktion.

    ctaColor:
        - Farbe
        - Bestimmen Sie die die Farbe der Aktion.

    ctaSize:
        - Größe
        - Bestimmen Sie die Größe der Aktion.

    ctaShape:
        - Form
        - Bestimmen Sie die Form der Aktion.

    contentWidth:
        - Inhaltsbreite
        - Bestimmen Sie die Breite des Inhalts.

    paddingTop:
        - Innerer Abstand des Elements nach oben
        - Bestimmen Sie den Abstand des Elements nach oben.

    paddingBottom:
        - Innerer Abstand des Elements nach unten
        - Bestimmen Sie den Abstand des Elements nach unten.

    marginTop:
        - Äußerer Abstand des Elements nach oben
        - Bestimmen Sie den Abstand des Elements nach oben.

    marginBottom:
        - Äußerer Abstand des Elements nach unten
        - Bestimmen Sie den Abstand des Elements nach unten.

    gridColumns:
        - Spalten
        - Legt fest, wie viele Elemente an den jeweiligen Brechpunkten angezeigt werden sollen.

    gridGap:
        - Abstand
        - Legt den Abstand zwischen den einzelnen Elementen fest.

    gridRatio:
        - Spalten-Verhältnis
        - Verteilt die Spalten ungleich (nur bei 2 oder 3 Spalten). Den Regler in 10%-Schritten ziehen.
    gridRatioEven:             Gleichmäßig – zum Anpassen ziehen
    gridRatioDisabled:         Die Spalten werden gleichmäßig über die Breite verteilt.

    backgroundColor:
        - Hintergrundfarbe
        - Wählen Sie die Hintergrundfarbe für das Inhaltselement.

    textAlignment:
        - Text-Ausrichtung
        - Hier können Sie die Textausrichtung für das Inhaltselement einstellen.

    textAppearance:
        - Text-Aussehen
        - Hier können Sie ein Aussehen für den Textinhalt auswählen.

    icon:
        - Icon
        - Hier können Sie ein Icon auswählen.

    iconPosition:
        - Position
        - Hier können Sie die Position des Icons auswählen.
