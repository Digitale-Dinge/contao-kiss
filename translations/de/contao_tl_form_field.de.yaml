tl_form_field:
    layout_legend:  Layout-Einstellungen
    appearance_legend:          Darstellungs-Einstellungen

    gridSpan:
        - Spaltenverhalten
        - Verhalten der Formularelemente in einem zweispaltigen Layout

    fieldColor:
        - Farbe
        - Hier können Sie die Farbe des Feldes auswählen.

    fieldSize:
        - Größe
        - Hier können Sie die Farbe des Feldes einstellen.

    fieldVariant:
        - Variante
        - Hier können Sie eine Variante für das Feld auswählen.

    fieldShape:
        - Form
        - Hier können Sie eine Form für das Feld auswählen.

    textAlignment:
        - Text-Ausrichtung
        - Hier können Sie die Textausrichtung für das Inhaltselement einstellen.

    textAppearance:
        - Text-Aussehen
        - Hier können Sie ein Aussehen für den Textinhalt auswählen.
