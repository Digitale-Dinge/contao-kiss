rsce:
    group:
        settings:               Element-Einstellungen
        media:                  Bild/Icon/Text
        grid:                   Grid-Einstellungen

    list:
        label:                  Elemente
        description:            'Fügen Sie eine beliebige Anzahl an Elementen ein.'
        element:                'Element %s'

    field:
        type:
            label:              Typ
            description:        Hier können Sie einen Element-Typen auswählen.
            options:
                image:          Bild
                icon:           Icon
                separated:      Separiert

        mediaType:
            label:              Typ
            description:        Hier können Sie einen Media-Typen auswählen.
            options:
                image:          Bild
                video:          Video

        callToAction:
            label:              Call-To-Action
            description:        Hier können Sie eine oder mehrere Call-To-Action angeben, welche im Element angezeigt werden sollen.
            element:            Aktion

        listLayout:
            label:              Layout
            description:        Wählen Sie zwischen einer kompakten (Mini) und einer großen Darstellung.
            options:
                mini:           Mini
                large:          Groß

    info-list:
        label:                  Info-Liste mit Icons
        description:            Eine Liste von Infos oder Kontaktdaten, jeweils mit Icon, Titel und Text.
        field:
            headline:
                label:          Titel
                description:    'Geben Sie den Titel des Eintrags ein, z. B. "Telefon".'

    media_text:
        label:                  Medien-Text
        description:            Ein Medien-Text Element
        field:
            show_as_card:
                label:          Als Karte anzeigen
                description:    Dieses Element als Karte anzeigen

    media_text_list:
        label:                  Medien-Text-Liste
        description:            Eine Medien-Text Liste
        field:
            show_as_card:
                label:          Als Karten anzeigen
                description:    Elemente als Karten anzeigen

    icon:
        label:                  Icon
        description:            Ein einzelnes Icon mit optionalem Beschreibungstext
        field:
            text:
                label:          Beschreibung
                description:    Ein beschreibender Text für das Icon

    logo:
        label:                  Logo
        description:            Hier können Sie ein Logo auswählen.
