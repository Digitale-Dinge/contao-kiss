rsce:
    group:
        settings:               Element settings
        media:                  Text/Medium
        grid:                   Grid settings
        appearance:             Appearance settings
        card:                   Card settings
        swiper:                 Slider settings

    list:
        label:                  Elements
        description:            'Insert any number of elements.'
        element:                'Element %s'

    field:
        addMedia:
            label:              Add media
            description:        Adds a medium to the element

        mediaType:
            label:              Media type
            description:        Here you can choose a media type.
            options:
                image:          Image
                icon:           Icon
                video:          Video

        callToAction:
            label:              Call-To-Action
            description:        Here you can enter one or more call-to-actions which will be displayed in the element.
            element:            Action

        imageUrl:
            label:              Image URL

        alertSize:
            label:              Size
            description:        Choose the size of the alert

        badgeSize:
            label:              Size
            description:        Choose the size of all badges

        badgeShape:
            label:              Shape
            description:        Choose the shape of all badges
            options:
                pill:           Pill
                square:         Square

        color:
            label:              Colour
            description:        Here you can choose a colour.

        variant:
            label:              Style
            description:        Here you can choose a style.
            options:
                soft:           Soft
                outline:        Outline
                dashed:         Dashed

    media_text:
        label:                  Text (with medium)
        description:            A media text element
        field:
            show_as_card:
                label:          Show as card
                description:    Show this element as a card


    media_text_list:
        label:                  Text list (with medium)
        description:            A media text list element
        field:
            add_media:
                label:          Add media
                description:    Adds a medium to the elements
            show_as_card:
                label:          Show as cards
                description:    Show elements as cards

    badge:
        label:                  Badge
        description:            Any number of badges with colour, style, icon and text
        field:
            text:
                label:          Text
                description:    The text of the badge

    alert:
        label:                  Alert
        description:            An alert box with title, text and color
        field:
            title:
                label:          Title
                description:    The title of the alert
            text:
                label:          Text
                description:    The description text of the alert

    icon:
        label:                  Icon
        description:            A single icon with optional description
        field:
            text:
                label:          Description
                description:    A describing text for the icon

    logo:
        label:                  Logo
        description:            Here you can choose a logo.
