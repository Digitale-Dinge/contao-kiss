rsce:
    group:
        settings:               Element settings
        media:                  Image/Icon/Text
        grid:                   Grid settings

    list:
        label:                  Elements
        description:            'Insert any number of elements.'
        element:                'Element %s'

    field:
        type:
            label:              Type
            description:        Here you can choose a type for the element.
            options:
                image:          Image
                icon:           Icon
                separated:      Separated

        mediaType:
            label:              Type
            description:        Here you can choose a media type.
            options:
                image:          Image
                video:          Video

        callToAction:
            label:              Call-To-Action
            description:        Here you can enter one or more call-to-actions which will be displayed in the element.
            element:            Action

        listLayout:
            label:              Layout
            description:        Choose between a compact (mini) and a large display.
            options:
                mini:           Mini
                large:          Large

    info-list:
        label:                  Info list with icons
        description:            A list of info or contact items, each with an icon, title and text.
        field:
            headline:
                label:          Title
                description:    'Enter the item''s title, e.g. "Phone".'

    media_text:
        label:                  Media text
        description:            A media text element
        field:
            show_as_card:
                label:          Show as card
                description:    Show this element as a card


    media_text_list:
        label:                  Media text list
        description:            A media text list element
        field:
            show_as_card:
                label:          Show as cards
                description:    Show elements as cards

    icon:
        label:                  Icon
        description:            A single icon with optional description
        field:
            text:
                label:          Description
                description:    A describing text for the icon

    logo:
        label:                  Logo
        description:            Here you can choose a logo.
