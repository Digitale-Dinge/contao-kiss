            show_as_card:
                label:          Show as cards
                description:    Show elements as cards

    card_group:
        label:                  Card group
        description:            A group of cards with a shared size, color and style

    icon:
        label:                  Icon
        description:            A single icon with optional description
        field:
            text:
                label:          Description
                description:    A describing text for the icon

    logo:
        label:                  Logo
        description:            Here you can choose a logo.
