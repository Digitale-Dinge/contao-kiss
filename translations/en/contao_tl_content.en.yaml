tl_content:
    layout_legend:              Layout settings

    grid:                       Column grid
    contentTeaser:              Teaser

    headline:
        unit:                   Unit
        appearance:             Appearance

    lightboxIframe:
        - Open content in iFrame
        - Opens the link in an iFrame and embeds the external page into the current page.

    topline:
        - Topline
        - Displays an optional topline above the headline.

    color:
        - Color
        - Define the color of the element.

    callToAction:
        - Call-To-Action
        - Here you can enter one or more call-to-actions which will be displayed on the website.

    ctaAsButton:
        - Als Button darstellen
        - Verändert die Darstellung von einem Textlink in einen Button

    ctaText:
        - Text
        - Hier können Sie einen Text eingeben.

    ctaType:
        - Type
        - Define the type of the action.

    ctaColor:
        - Color
        - Define the color of the action.

    ctaSize:
        - Size
        - Define the size of the action.

    ctaShape:
        - Form
        - Bestimmen Sie die Form der Aktion.

    contentWidth:
        - Content width
        - Define the width of the content.

    paddingTop:
        - Inner spacing at the top
        - Define the spacing at the top of the element.

    paddingBottom:
        - Inner spacing at the bottom
        - Define the spacing at the bottom of the element.

    marginTop:
        - Outer spacing at the top
        - Define the spacing above the element.

    marginBottom:
        - Outer spacing at the bottom
        - Define the spacing below the element.

    backgroundColor:
        - Background color
        - Choose the background color for the content element.

    textAppearance:
        - Text appearance
        - Here you can choose an appearance for the text content.

    icon:
        - Icon

    iconColor:
        primary: Primary
        secondary: Secondary
        outline: Outline

    iconPosition:
        - Position
        - Select the desired position of the icon.

    iconPositionOptions:
        right: Right
        left: Left
