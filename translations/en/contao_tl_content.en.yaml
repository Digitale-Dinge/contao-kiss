tl_content:
    layout_legend:              Layout settings
    grid_legend:                Grid settings
    appearance_legend:          Appearance settings

    grid:                       Column grid
    contentTeaser:              Teaser

    headline:
        unit:                   Unit
        appearance:             Appearance

    lightboxIframe:
        - Open content in iFrame
        - Opens the link in an iFrame and embeds the external page into the current page.

    topline:
        - Topline
        - Displays an optional topline above the headline.

    color:
        - Color
        - Define the color of the element.

    callToAction:
        - Call-To-Action
        - Here you can enter one or more call-to-actions which will be displayed on the website.

    ctaAsButton:
        - Als Button darstellen
        - Verändert die Darstellung von einem Textlink in einen Button

    ctaText:
        - Text
        - Hier können Sie einen Text eingeben.

    ctaType:
        - Type
        - Define the type of the action.

    ctaColor:
        - Color
        - Define the color of the action.

    ctaSize:
        - Size
        - Define the size of the action.

    ctaShape:
        - Shape
        - Here you can define the shape of the action.

    contentWidth:
        - Content width
        - Define the width of the content.

    paddingTop:
        - Inner spacing at the top
        - Define the spacing at the top of the element.

    paddingBottom:
        - Inner spacing at the bottom
        - Define the spacing at the bottom of the element.

    marginTop:
        - Outer spacing at the top
        - Define the spacing above the element.

    marginBottom:
        - Outer spacing at the bottom
        - Define the spacing below the element.

    gridColumns:
        - Columns
        - Defines how many items should be shown over the respective breakpoints.

    gridGap:
        - Gap
        - Defines the spacing between each item.

    gridCrossAlignment:
        - Vertical Alignment
        - Defines the vertical Alignment of the elements.

    slidesPerView:
        - Cards per row
        - Number of cards side by side on desktop (e.g. 3). Tablet and mobile step down automatically. Leave empty for one full-width slide.

    backgroundColor:
        - Background color
        - Choose the background color for the content element.

    textAlignment:
        - Text alignment
        - Here you can set up the text alignment for the content element.

    textAppearance:
        - Text appearance
        - Here you can choose an appearance for the text content.

    showAsCard:
        - Show as card
        - Show this element as a card.

    icon:
        - Icon
        - Here you can choose an icon.

    iconPosition:
        - Position
        - Here you can choose the position of the icon.

    elementSize:
        - Size
        - Define the size of the element.
        - Normal # Default label - size

    elementLayout:
        - Medium layout
        - Define the arrangement of media and content.

    elementVariant:
        - Style
        - Define the style of the element.

    responsiveVideo:
        - Videos
        - Here you can select videos to be loaded in responsive views.

    responsiveVideoFieldScreen: Device

    responsiveVideoFieldVideo:  Video

    responsiveVideoOptions:
        mobile:                 Default
        tablet:                 From tablet (>= 768px)
        desktop:                From desktop (>= 1024px)
