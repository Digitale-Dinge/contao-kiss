name: CI

on:
    push:
        branches:
            - main
    pull_request: ~

permissions: read-all

jobs:
    twig-cs-fixer:
        name: Twig CS Fixer
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install Twig CS Fixer
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/twig-cs-fixer

            - name: Run Twig CS Fixer
              run: vendor-bin/twig-cs-fixer/vendor/bin/twig-cs-fixer lint

    depcheck:
        name: Dependency analyser
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Run the dependency analyser
              run: composer depcheck

    tests:
        name: Tests PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Run the unit tests
              run: composer unit-tests

    linter:
        name: Linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the Node packages
              run: npm install
              working-directory: build

            - name: Run Biome
              run: npx biome ci assets
              working-directory: build

            - name: Run Stylelint
              run: npx stylelint "assets/**/*.{css,pcss}" --allow-empty-input
              working-directory: build
